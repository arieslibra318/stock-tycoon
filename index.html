<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2b2622"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="證券大亨"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>證券大亨</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Serif+TC:wght@700;900&family=VT323&display=swap">
<style>
/* 版面：全螢幕 3D 城市小行星＋1980 年代證券行風格 HUD（報紙米黃、台股紅漲綠跌、LED 琥珀看板） */
:root{
  --paper:#f6eedb; --paper-2:#eadfc4; --ink:#2b2622; --ink-soft:#6b6155;
  --up:#d7263d; --down:#14965a; --led:#ffb000; --board:#15110d;
  --accent:#c8402f; --gold:#e3a52b; --teal:#2b7f86; --shadow:rgba(30,20,10,.3);
  --f-ui:'Huninn','Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --f-news:'Noto Serif TC','Songti TC','PMingLiU',serif;
  --f-led:'VT323',ui-monospace,monospace;
  color-scheme:light;
}
html,body{height:100%;margin:0;background:#cdb88f;color:var(--ink);font-family:var(--f-ui);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.paper{background:var(--paper);border:2.5px solid var(--ink);border-radius:12px;box-shadow:0 4px 0 var(--ink),0 10px 24px var(--shadow)}
.hide{display:none!important}
.up{color:var(--up)}.down{color:var(--down)}
#hud{position:absolute;inset:0;pointer-events:none}
#hud > *{pointer-events:auto}
#tl{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:7px;align-items:flex-start;max-width:min(46vw,330px)}
.brand{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px}
.brand canvas{width:44px;height:44px;border-radius:50%;background:#e9d9b4;border:2px solid var(--ink)}
.brand b{display:block;font-size:16px}
.brand small{display:block;font-size:12px;color:var(--ink-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;gap:6px;align-items:baseline;padding:3px 10px;font-size:13px;background:var(--paper);border:2px solid var(--ink);border-radius:8px;box-shadow:0 2px 0 var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip i{font-style:normal;font-size:11px;color:var(--ink-soft)}
.chip.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.18)}}
#ticker{position:absolute;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--board);color:var(--led);border:2.5px solid var(--ink);border-radius:10px;box-shadow:0 3px 0 var(--ink);padding:4px 14px 2px;font-family:var(--f-led);font-size:24px;line-height:1;display:flex;gap:12px;align-items:center;white-space:nowrap}
#ticker .ph{font-family:var(--f-ui);font-size:12px;padding:2px 8px;border-radius:6px;background:#3a2f22;color:#f6eedb}
#ticker .ph.open{background:var(--up)}
#ticker .wx{font-family:var(--f-ui);font-size:12px;padding:2px 8px;border-radius:6px;background:#2b3a55;color:#e8f0ff}
.goals{padding:8px 10px;font-size:13px;line-height:1.5;display:flex;flex-direction:column;gap:4px;max-width:300px}
.goals b{font-size:11px;letter-spacing:.1em;color:var(--ink-soft)}
.goals button{all:unset;cursor:pointer;display:flex;gap:6px;align-items:flex-start}
.goals button:hover span:last-child{text-decoration:underline}
.goals button:focus-visible{outline:2px solid var(--gold)}
.goals .dot{width:10px;height:10px;border:2px solid var(--ink);border-radius:3px;flex:none;margin-top:4px}
.goals .go{font-size:11px;color:var(--teal);margin-left:4px;white-space:nowrap}
.lbl.goal{background:var(--teal);color:#fff;border-color:var(--ink)}
.guide h4{margin:14px 0 4px}.guide p,.guide li{line-height:1.75}.guide ul{margin:0;padding-left:20px}
#ticker .tl2{font-family:var(--f-ui);font-size:12px;color:#c9b48a}
#tr{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));display:flex;gap:7px}
.ib{width:46px;height:46px;border-radius:12px;background:var(--paper);border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;padding:0;position:relative;font-size:11px}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.ib svg{width:25px;height:25px}
.ib.off::after{content:"";position:absolute;left:8px;right:8px;top:50%;height:3px;background:var(--accent);transform:rotate(-40deg)}
.ib .badge{position:absolute;right:-6px;top:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;display:grid;place-items:center;border:2px solid var(--ink)}
#pauseTag{position:absolute;left:50%;top:calc(58px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:5px 14px;border-radius:8px;font-size:13px;white-space:nowrap;max-width:calc(100vw - 24px);overflow:hidden;text-overflow:ellipsis}
.ib.on{background:var(--gold)}
.mtabs{display:flex;gap:6px;margin:4px 0 8px}
#prompt{position:absolute;left:50%;bottom:calc(64px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:8px 16px;font-size:15px;white-space:nowrap;display:flex;gap:8px;align-items:center;cursor:pointer}
#prompt kbd{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:6px;background:var(--ink);color:var(--paper);font-family:var(--f-led);font-size:20px}
#toasts{position:absolute;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{padding:7px 16px;font-size:14px;background:var(--paper);border:2.5px solid var(--ink);border-radius:999px;box-shadow:0 3px 0 var(--ink);animation:tin .3s ease-out,tout .4s ease-in 2.8s forwards;max-width:calc(100vw - 32px);text-align:center}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}
@keyframes tout{to{opacity:0;transform:translateY(-6px)}}
#marquee{position:absolute;left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--board);border-top:2.5px solid var(--ink);overflow:hidden;height:calc(34px + env(safe-area-inset-bottom,0px));pointer-events:none}
#mqIn{position:absolute;left:0;top:4px;white-space:nowrap;font-family:var(--f-led);font-size:24px;color:var(--led);will-change:transform}
#mqIn span{margin-right:34px}
#hint{position:absolute;left:50%;bottom:calc(42px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-size:12px;padding:4px 12px;background:rgba(246,238,219,.92);border:2px solid var(--ink);border-radius:999px;white-space:nowrap;pointer-events:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;font-size:12px;padding:2px 8px;background:rgba(246,238,219,.95);border:2px solid var(--ink);border-radius:6px;white-space:nowrap;pointer-events:none;will-change:transform}
.lbl.q{background:var(--gold)}
.lbl.me{background:var(--accent);color:#fff}
.lbl.map{pointer-events:auto;cursor:pointer;font-size:13px}
#touch{position:absolute;inset:0;pointer-events:none}
#joy{position:absolute;left:calc(24px + env(safe-area-inset-left,0px));bottom:calc(56px + env(safe-area-inset-bottom,0px));width:124px;height:124px;border-radius:50%;background:rgba(246,238,219,.35);border:2.5px solid rgba(43,38,34,.6);pointer-events:auto;touch-action:none}
#joyK{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:var(--paper);border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
#tbtns{position:absolute;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(58px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:flex-end;pointer-events:auto}
.tb{width:62px;height:62px;border-radius:50%;background:var(--paper);border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);font-size:15px;touch-action:none;padding:0}
.tb.big{width:76px;height:76px;background:var(--accent);color:#fff;font-size:17px}
#dialog{position:absolute;left:50%;bottom:calc(46px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(680px,calc(100vw - 24px));display:flex;gap:12px;padding:14px 16px 14px 14px;cursor:pointer}
#dlgP{width:72px;height:72px;flex:none;border-radius:50%;border:2.5px solid var(--ink);background:#e9d9b4}
#dlgBody{flex:1;min-width:0}
#dlgName{display:inline-block;font-size:14px;background:var(--ink);color:var(--paper);padding:2px 10px;border-radius:6px;margin-bottom:6px}
#dlgText{font-size:17px;line-height:1.6;min-height:3.2em}
#dlgNext{position:absolute;right:16px;bottom:10px;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:10px solid var(--accent);animation:nb .8s infinite}
@keyframes nb{50%{transform:translateY(4px)}}
#dlgCh{display:flex;flex-direction:column;gap:8px;margin-top:8px}
#dlgCh button{text-align:left;border:2.5px solid var(--ink);background:#fff;border-radius:10px;padding:8px 14px;font-size:16px;box-shadow:0 3px 0 var(--ink)}
#dlgCh button:hover,#dlgCh button.sel{background:#fbe6c4}
.modal{position:absolute;inset:0;display:grid;place-items:center;background:rgba(30,20,10,.4);padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.box{width:min(760px,100%);max-height:min(88vh,780px);display:flex;flex-direction:column;overflow:hidden}
.bh{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:2.5px solid var(--ink);background:var(--paper-2)}
.bh h3{margin:0;font-size:18px;flex:1}
.bh .x{width:36px;height:36px;border-radius:10px;border:2.5px solid var(--ink);background:#fff;font-size:20px;padding:0}
.bb{overflow:auto;padding:12px 14px 16px;background:#fffaf0;flex:1;min-height:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:2px solid var(--ink);background:#fff;border-radius:8px;padding:4px 12px;font-size:14px}
.tab.on{background:var(--ink);color:var(--paper)}
table.q{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.q th{font-size:12px;color:var(--ink-soft);text-align:right;font-weight:400;padding:4px 6px;border-bottom:2px solid var(--ink)}
table.q th:first-child,table.q td:first-child{text-align:left}
table.q td{padding:7px 6px;border-bottom:1.5px dashed #d8c9a8;text-align:right;white-space:nowrap}
table.q td .sec{display:block;font-size:11px;color:var(--ink-soft)}
.tw{overflow-x:auto}
.lbl.door{background:#ff8a1f;color:#fff;border-color:var(--ink)}
.alBar{display:flex;height:22px;border:2px solid var(--ink);border-radius:8px;overflow:hidden;margin:6px 0 10px}
.alBar span{min-width:2px}
.alDot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1px solid var(--ink)}
.alSec{display:grid;grid-template-columns:64px 1fr 44px;gap:8px;align-items:center;font-size:13px;margin:3px 0}
.alTrack{height:10px;background:#efe6d2;border-radius:5px;overflow:hidden}.alTrack span{display:block;height:100%;background:var(--accent)}
#chNet,#chCash{pointer-events:auto}
.lbl.tap{pointer-events:auto;cursor:pointer}
#title #titleNote{background:rgba(43,38,34,.68);padding:8px 14px;border-radius:10px;text-shadow:none}
.mmInfo{font-size:13px;color:var(--ink-soft);padding:4px 6px}
@media (max-width:640px){
  html body #tl{max-width:calc(100vw - 132px)}
  #tl .chips{gap:4px}#tl .chip{padding:2px 7px;font-size:12px}#tl .chip i{font-size:10px}
  #chStep{display:none}
  html body #toasts{top:auto;bottom:calc(262px + env(safe-area-inset-bottom,0px));width:calc(100vw - 32px)}
  html body .toast{font-size:13px;padding:6px 12px;text-align:center}
}
@media (orientation:landscape) and (max-height:500px){
  html body #tl{top:calc(6px + env(safe-area-inset-top,0px));max-width:min(36vw,280px);gap:4px}
  .brand > div{display:none}.brand{padding:3px}.brand canvas{width:32px;height:32px}
  #tl .chips{gap:4px}#tl .chip{padding:1px 7px;font-size:12px}#tl .chip i{font-size:10px}#chStep{display:none}
  .goals{max-height:38vh;overflow:auto}
  html body #tr{top:calc(6px + env(safe-area-inset-top,0px))}
  html body #ticker{top:calc(56px + env(safe-area-inset-top,0px))}
  html body #mini.touch{top:calc(98px + env(safe-area-inset-top,0px));width:88px;height:88px}
  html body #hint{display:none}
  #joy{width:100px;height:100px;bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  #tbtns{bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  .tb{width:52px;height:52px}.tb.big{width:64px;height:64px}
  #marquee{display:none}
  html body #prompt{bottom:calc(82px + env(safe-area-inset-bottom,0px))}
  html body #toasts{top:auto;bottom:calc(124px + env(safe-area-inset-bottom,0px));max-width:min(560px,70vw)}
  #dialog{bottom:calc(8px + env(safe-area-inset-bottom,0px))}
  .modal{padding:6px}.box{max-height:calc(100vh - 12px)}
}
.gHead{display:flex!important;gap:6px;align-items:center}
.gCnt{min-width:18px;height:18px;border-radius:9px;background:var(--ink);color:var(--paper);font-size:11px;display:grid;place-items:center;padding:0 4px}
.gArr{font-size:12px;color:var(--ink-soft)}
.gPeek{font-size:12px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bMore{display:none}
#moreMenu{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:calc(96px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;padding:6px;gap:4px;min-width:150px;z-index:5}
#moreMenu.hide{display:none}
#moreMenu button{font:inherit;font-size:15px;text-align:left;padding:10px 12px;border:2px solid var(--ink);border-radius:9px;background:#fff}
.chToggle{width:100%;margin-bottom:10px}
@media (max-width:640px){
  #bMap,#bSound,#bSave,#bMenu{display:none}
  #bMore{display:grid}
  #tr .ib{width:40px;height:40px}#tr .ib svg{width:21px;height:21px}
  #trade.modal,#notes.modal,#help.modal,#saves.modal{padding:0}
  #trade .box,#notes .box,#help .box,#saves .box{width:100%;height:100%;max-height:none;border-radius:0}
  #trBody .tw{overflow:visible}
  #trBody table.q,#trBody table.q tbody{display:block}
  #trBody table.q tr:first-child{display:none}
  #trBody table.q tr{display:grid;grid-template-columns:1fr auto auto;gap:3px 12px;align-items:center;padding:9px 2px;border-bottom:1.5px dashed #d8c9a8}
  #trBody table.q tr.chOn{background:#fff3cf}
  #trBody table.q td{border:0;padding:0}
  #trBody table.q td:first-child{text-align:left;font-size:15px}
  #trBody table.q td[data-l]{font-size:12px;color:var(--ink-soft);text-align:left}
  #trBody table.q td[data-l]::before{content:attr(data-l) " ";font-size:11px;opacity:.8}
  #trBody table.q td:last-child{grid-column:1/-1;display:flex;gap:6px;margin-top:4px}
  #trBody table.q td:last-child .qb{flex:1;height:40px;font-size:15px;margin:0}
  #trBody .qtyBar,#trBody .mtabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  #trBody .qtyBar>*,#trBody .mtabs>*{flex:none}
}
#mini{position:absolute;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(46px + env(safe-area-inset-bottom,0px));width:150px;height:150px;border-radius:50%;cursor:pointer;filter:drop-shadow(0 3px 0 rgba(43,38,34,.9))}
#mini.touch{bottom:auto;top:calc(120px + env(safe-area-inset-top,0px));width:104px;height:104px}
.tagN,.tagW{display:inline-block;margin-left:4px;padding:0 5px;border-radius:4px;font-size:11px;color:#fff;vertical-align:1px}
.tagN{background:#d7263d}.tagW{background:#555}
.secBar .tab{padding:2px 8px}
.ipoBox,.callBox{display:flex;flex-direction:column;gap:6px}
.callBox{background:#fbe1e1}
.ipoBox .btn,.callBox .btn{font-size:13px;padding:3px 10px;margin-left:6px}
#newBox{max-width:560px;width:100%;text-align:left;padding:14px 16px;border:3px solid var(--ink);border-radius:14px;background:#fffaf0;color:var(--ink);box-shadow:0 6px 0 rgba(0,0,0,.25)}
#newBox h3{margin:0 0 6px}
.nbRow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.nbRow>span{min-width:64px;font-weight:700}
.nbNote{font-size:13px;color:var(--ink-soft);margin:2px 0;line-height:1.6}
.qtyBar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0 0 8px;font-size:13px}
.qtyBar>span{font-weight:700;margin-right:2px}
.qtyBar .tab{padding:3px 10px;font-size:13px}
#flash{position:fixed;inset:0;pointer-events:none;z-index:25;opacity:0;background:radial-gradient(ellipse at center,transparent 42%,var(--fc,rgba(255,196,60,.8)) 100%)}
#flash.go{animation:flashK 1.2s ease-out}
#flash.go.alarm{animation:flashK .8s ease-in-out 3}
@keyframes flashK{0%{opacity:0}18%{opacity:1}100%{opacity:0}}
#ending{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden}
#ending.hide{display:none}
#endCv{position:absolute;inset:0;width:100%;height:100%;display:block}
#endWrap{position:relative;width:calc(100% - 32px);max-width:640px;max-height:calc(100% - 24px);overflow-y:auto;text-align:center;color:#fff;padding:12px 0}
.endStory{transition:opacity .7s;cursor:pointer}
.endTag{letter-spacing:.35em;font-size:13px;opacity:.85}
.endTitle{font:900 clamp(32px,8vw,56px)/1.2 "Noto Serif TC",serif;margin:6px 0 16px;text-shadow:0 3px 0 rgba(0,0,0,.45);opacity:0;transform:translateY(14px);transition:all 1.2s}
.endPaper{display:inline-block;background:#f4ecd8;color:#2b2622;border:3px solid #2b2622;border-radius:6px;padding:8px 16px 10px;font:900 clamp(16px,3.8vw,22px)/1.5 "Noto Serif TC",serif;box-shadow:0 8px 0 rgba(0,0,0,.35);margin:0 auto 18px;opacity:0;transform:rotate(-3deg) scale(.5);transition:all .8s cubic-bezier(.2,1.5,.4,1)}
.endPaper small{display:block;font-size:12px;letter-spacing:.25em;border-bottom:2px solid #2b2622;margin-bottom:4px;padding-bottom:2px}
.endLines p{font-size:clamp(15px,3.6vw,18px);line-height:1.8;margin:4px 0;opacity:0;transform:translateY(8px);transition:all .9s;text-shadow:0 2px 6px rgba(0,0,0,.7)}
.endTitle.on,.endLines p.on{opacity:1;transform:none}
.endPaper.on{opacity:1;transform:rotate(-2deg)}
.endQuote{font:900 clamp(18px,4.4vw,26px)/1.5 "Noto Serif TC",serif;margin-top:16px;opacity:0;transition:opacity 1.4s;color:#ffe2a0;text-shadow:0 2px 8px rgba(0,0,0,.7)}
.end-rain .endQuote{color:#d8e6ee}
.endStats{display:none;opacity:0;transition:opacity .8s;background:#fffaf0;color:#2b2622;border:3px solid #2b2622;border-radius:14px;padding:14px 16px;text-align:left}
.endStats table.q{width:100%;margin-bottom:8px}
.endSkip{position:fixed;right:16px;bottom:16px;z-index:61;font:inherit;font-size:14px;color:#fff;background:rgba(0,0,0,.35);border:1.5px solid rgba(255,255,255,.6);border-radius:999px;padding:6px 14px;cursor:pointer}
.chBox{border:2px solid var(--ink);border-radius:10px;background:#fffaf0;padding:8px 10px 4px;margin-bottom:10px}
.chBar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.chBar select{font:inherit;font-size:14px;padding:4px 8px;border:2px solid var(--ink);border-radius:8px;background:#fff}
.chHead{font-size:14px;margin:2px 0}
.chart{width:100%;height:auto;display:block}
.chT{font-size:12px;fill:#6b5d4a;font-variant-numeric:tabular-nums}

const R = 26;

const ROADS = {

function pickR(r, a) { return a[r() * a.length | 0]; }

function pickTip(r, pool, d) {

}
function makeRumor(npc, d) {

      const h = e.def.hints.filter(x => x[0] === npc.role);
      if (h.length && r() < npc.rel + 0.1) return { kind: 'event', ev: e.id, text: pickR(r, h)[1], truth: true, resolve: e.day };
    }
  }
  if (r() < (1 - npc.rel) * 0.35) {
    const soon = SEASON.events.filter(e => e.day >= d && e.day <= d + 6).map(e => e.id);
    const fake = EVENTS.filter(e => !soon.includes(e.id) && e.hints.some(h => h[0] === npc.role || npc.role === 'auntie' || npc.role === 'taxi'));
    if (fake.length) { const e = pickR(r, fake); return { kind: 'event', ev: null, evName: e.name, text: pickR(r, e.hints)[1], truth: false, resolve: Math.min(DAYS, d + 3) }; }
  }
  if (d + 1 > DAYS) return null;
  const pool = (npc.sectors ? STOCKS.filter(s => npc.sectors.includes(s.sector)) : STOCKS).filter(s => listed(STOCKS.indexOf(s), d + 1));
  if (!pool.length) return null;
  const s = pickTip(r, pool, d), i = STOCKS.indexOf(s), act = SEASON.ret[d + 1][i] >= 0 ? 1 : -1;
  const dir = r() < npc.rel ? act : -act;
  return { kind: 'tip', stock: s.id, dir, text: pickR(r, dir > 0 ? TIP_UP : TIP_DN).replace('{n}', s.name), resolve: d + 1 };
}
function resolveRumors(d) {
  let ok = 0, no = 0;
  for (const m of S.rumors) {
    if (m.st || m.resolve !== d) continue;
    if (m.kind === 'tip') { const i = STOCKS.findIndex(s => s.id === m.stock); const real = SEASON.ret[d][i]; m.st = real === 0 ? 'no' : (real > 0 ? 1 : -1) === m.dir ? 'ok' : 'no'; }
    else if (m.kind === 'sector') { let t = 0, n = 0; STOCKS.forEach((s, i) => { if (s.sector !== m.sector || !listed(i, m.day + 1) || !listed(i, d)) return; let c = 1; for (let k = m.day + 1; k <= d; k++) c *= 1 + SEASON.ret[k][i]; t += c - 1; n++; }); m.st = n && Math.sign(t) === m.dir ? 'ok' : 'no'; }
    else m.st = m.truth ? 'ok' : 'no';
    m.st === 'ok' ? ok++ : no++;
  }
  return [ok, no];
}

function order(id, q, mode = 'cash') {
  if (PHASE() !== 'open' || !canTradeHere()) return;
  if (isClosed(S.day)) { toast('颱風假休市，今天不能下單'); return; }
  const i = STOCKS.findIndex(s => s.id === id), name = STOCKS[i].name, p = prices()[i], [up, dn] = limits(prevClose()[i]), unit = p * LOT;
  const tidy = () => { for (const k of ['hold', 'mar', 'sht']) for (const x in S[k]) if (!S[k][x].q) delete S[k][x]; };
  const fail = m => { tidy(); toast(m); sfx('bad'); };
  const fit = (q, per) => { if (q * per > S.cash) q = Math.floor(S.cash / per); return q; };
  if (!listedNow(i)) return fail(`${name}目前沒有在交易`);
  if (mode !== 'cash' && q > 0 && isWatch(i)) return fail(`${name}是全額交割股，不能融資融券`);
  if (mode === 'cash') {
    const hd = S.hold[id] || (S.hold[id] = { q: 0, cost: 0 });
    if (q > 0) {
      if (p >= up) return fail(`${name}漲停鎖住，掛了也買不到`);
      q = fit(q, unit * (1 + FEE)); if (q < 1) return fail('現金不夠');
      hd.cost = (hd.cost * hd.q + p * q) / (hd.q + q); hd.q += q; S.cash -= unit * q * (1 + FEE); toast(`買進 ${name} ${q} 張 @${p.toFixed(2)}`);
    } else {
      if (p <= dn) return fail(`${name}跌停鎖住，掛了也賣不掉`);
      q = Math.min(hd.q, -q); if (q < 1) return;
      S.cash += unit * q * (1 - FEE - TAX); hd.q -= q; toast(`賣出 ${name} ${q} 張 @${p.toFixed(2)}`);
    }
    if (!hd.q) delete S.hold[id];
  } else if (mode === 'mar') {
    const m = S.mar[id] || (S.mar[id] = { q: 0, cost: 0, loan: 0 });
    if (q > 0) {
      if (p >= up) return fail(`${name}漲停鎖住，掛了也買不到`);
      q = fit(q, unit * (1 - MARGIN_LOAN + FEE)); if (q < 1) return fail('自備款不夠（融資要自備 4 成）');
      m.cost = (m.cost * m.q + p * q) / (m.q + q); m.q += q; m.loan += unit * q * MARGIN_LOAN; S.cash -= unit * q * (1 - MARGIN_LOAN + FEE);
      toast(`融資買進 ${name} ${q} 張 @${p.toFixed(2)}，借款 ${wan(unit * q * MARGIN_LOAN)}`);
    } else {
      if (p <= dn) return fail(`${name}跌停鎖住，掛了也賣不掉`);
      q = Math.min(m.q, -q); if (q < 1) return;
      const repay = m.loan * q / m.q; S.cash += unit * q * (1 - FEE - TAX) - repay; m.loan -= repay; m.q -= q; toast(`融資賣出 ${name} ${q} 張 @${p.toFixed(2)}，還款 ${wan(repay)}`);
    }
    if (!m.q) delete S.mar[id];
  } else {
    const t = S.sht[id] || (S.sht[id] = { q: 0, cost: 0, margin: 0, proceeds: 0 });
    if (q > 0) {
      if (p <= dn) return fail(`${name}跌停了，不能再放空`);
      if (limitOf(S.day).ns && p <= prevClose()[i]) return fail('主管機關暫停平盤以下融券放空');
      q = fit(q, unit * SHORT_MARGIN); if (q < 1) return fail('保證金不夠（融券要繳 9 成保證金）');
      t.cost = (t.cost * t.q + p * q) / (t.q + q); t.q += q; t.margin += unit * q * SHORT_MARGIN; t.proceeds += unit * q * (1 - FEE - TAX - SHORT_FEE); S.cash -= unit * q * SHORT_MARGIN;
      toast(`融券賣出 ${name} ${q} 張 @${p.toFixed(2)}`);
    } else {
      if (p >= up) return fail(`${name}漲停鎖住，回補不到`);
      q = Math.min(t.q, -q); if (q < 1) return;
      const f = q / t.q, rel = (t.margin + t.proceeds) * f; S.cash += rel - unit * q * (1 + FEE); t.margin *= 1 - f; t.proceeds *= 1 - f; t.q -= q; toast(`融券回補 ${name} ${q} 張 @${p.toFixed(2)}`);
    }

}
// 收盤：下市清算、融資付利息、檢查維持率（低於 130% 先追繳，期限到了才強制平倉）
function settleMargin() {
  const d = S.day, p = SEASON.close[d], msgs = []; S.calls = S.calls || {};
  if (SEASON.delist && SEASON.delist.day === d) msgs.push(delistSettle(SEASON.delist.i, p[SEASON.delist.i]));
  STOCKS.forEach((s, i) => {
    const m = S.mar[s.id];
    if (m) { S.cash -= m.loan * LOAN_DAY; const v = m.q * LOT * p[i]; checkCall(s, 'mar', v / m.loan, msgs, () => { S.cash += v * (1 - FEE - TAX) - m.loan; delete S.mar[s.id]; }); }
    const t = S.sht[s.id];

  });

    <p>想慢慢想的時候，按 <b>P</b>（或右上 ⏸）暫停時間；暫停時還是可以走動、看盤、翻消息本。設定裡也可以把時間調慢。</p>
    <h4>2. 怎麼判斷消息</h4>
    <ul><li>每個人的準確度不一樣，而且不會告訴你。消息本的「消息來源戰績」會記下誰說中、誰落空。</li><li>大事件爆發前幾天，相關的人會先聽到風聲（例如記者、銀行襄理）。也有人會講根本不會發生的事。</li><li>阿財哥說要「照顧」某檔股票時，通常會先拉兩天、第三天開始倒貨。</li></ul>
    <h4>3. 現股、融資、融券</h4>
    <ul><li><b>現股</b>：用自己的錢買賣，1 張＝1000 股。</li><li><b>融資</b>：自備 4 成、借 6 成買股票，每天付利息。漲了賺得多，跌了賠得快。</li><li><b>融券</b>：繳 9 成保證金，先借股票來賣，跌了再買回來賺差價。</li><li>維持率收盤低於 130% 會被強制了結（斷頭）。漲停買不到、跌停賣不掉，跌停時也不能放空。</li></ul>
    <h4>4. 漲跌幅與政策突發事件</h4>
    <ul><li>一開始漲跌幅限制是 7%。每天都有小機率發生「制度改革」，從此放寬成 10%（改編自 2015 年）。</li><li>連續兩天大跌超過 11% 時，主管機關有機會出手：接下來 5 天跌幅縮小為 3.5%，並暫停平盤以下融券放空（改編自 2008 年金融海嘯）。</li><li>看盤畫面下方會寫今天的漲跌幅限制。</li></ul>
    <h4>5. 股票類型</h4>
    <ul><li><b>成長股</b>（電子、半導體、伺服器、生技）：波動大，景氣好、題材熱時漲得兇，升息時跌得重。</li><li><b>價值股</b>（金融、電信、食品、紡織資產股）：波動小，比較抗跌。</li><li><b>景氣循環股</b>（塑化、鋼鐵、航運、營建）：跟著景氣、油價和原物料起伏。</li></ul>
    <h4>6. 天氣與情緒</h4>
    <ul><li>晴天大家心情好，股價稍微偏多；下雨天證券行人少，成交量變小、股價稍微偏弱；遇到颱風會放颱風假、休市一天。影響都很小，大方向還是看消息和事件。</li><li>在設定裡可以改成「台北即時天氣」（要在 GitHub Pages 等一般網頁上才抓得到，Claude 的預覽頁面會擋外部連線）。</li></ul>
    <h4>7. 事件卡與歷史小百科</h4>
    <p>每個月會從真實歷史改編的事件裡抽 5 張，隨機排列，包括 1987 黑色星期一、1979–1981 聯準會暴力升息、1995–1996 台海飛彈危機、1997 亞洲金融風暴、2023–2024 AI 浪潮等。爆發時會出現「號外」，消息本的「歷史小百科」記錄它改編自哪一段歷史。地下投資公司每個月一定會倒，別把錢放太久。</p>
    <h4>8. 身分晉升</h4>
    <p><b>結局</b>：故事共 ${FINAL_SEASON} 個月，第 ${FINAL_SEASON} 個月（${yearOf(FINAL_SEASON)} 年）結束時，總資產 ${wan(winNet())} 以上是成功結局、低於本金 ${wan(START_CASH)} 是失敗結局，中間是普通結局。中途當上證券大亨會提早迎來成功結局，總資產跌破 ${BROKE_NET / 1e4} 萬 則提早失敗。結局之後可以繼續自由遊玩。本局共 ${FINAL_SEASON} 個月、每個月 ${DAYS} 天。</p>
    <p>${RANKS.map(r => `${r.name}（${wan(r.min)}）`).join(' → ')}。大哥大一支 ${wan(PHONE_PRICE)}，買了以後在哪裡都能下單。</p>
    <h4>9. 操作</h4>
    <p>WASD／方向鍵移動、Shift 快跑、E 說話、K 看盤下單、N 消息本、P 暫停、T 快轉到下一個時段、M 城市地圖、H 指南、Q 暫存、O 存檔與讀檔、拖曳轉視角。遊戲不會自動存檔，記得隨手按 Q 留暫存點。手機用左下搖桿、右下「互動」「看盤」。</p>
    <p class="note">這是原型。公司、人物與行情都是虛構的；重大事件改編自 1980 年代末到 1990 年的台灣與國際股市歷史，經過隨機排列，僅供體驗與學習，不構成任何投資建議。</p></div>`;
  else h += `
    <p>盤中時間（09:00–13:30）：${SPEEDS.map(([v, t]) => `<button class="btn ${(S.spOpen || 1) === v ? 'pri' : ''}" data-spo="${v}">${t}</button>`).join(' ')}</p>
    <p>逛街時間（盤前、盤後、晚上）：${SPEEDS.map(([v, t]) => `<button class="btn ${(S.spWalk || 1) === v ? 'pri' : ''}" data-spw="${v}">${t}</button>`).join(' ')}</p>
    <p class="note">照現在的設定，一天大約 ${dayMinutes()} 分鐘（說話、看盤、看報紙時時間會暫停）。逛完了可以按「快轉」，或回家睡覺直接跳到隔天。</p>
    <p>天氣來源：<button class="btn" id="hpWx">${S.realWx ? '台北即時天氣（開）' : '遊戲模擬天氣'}</button></p>
    <p class="note" style="margin-top:-4px">即時天氣使用 Open-Meteo 的台北天氣，只會在盤前套用到「今天」。抓不到時自動改用模擬天氣。</p>
    <p><button class="btn" id="hpMus">音樂：${S.music ? '開' : '關'}</button> <button class="btn" id="hpSfx">音效：${S.sfx ? '開' : '關'}</button> <button class="btn" id="hpPow">省電模式：${POWER ? '開' : '關'}</button> <button class="btn" id="hpVib">震動：${VIB ? '開' : '關'}</button> <button class="btn" id="hpReset">重新開始新的一年</button></p>
    <p class="note"><b>手機小技巧</b>：點人物頭上的名字，阿德會自己走過去說話。想像 App 一樣全螢幕玩，可以把遊戲加入主畫面——iPhone 用 Safari 的「分享 → 加入主畫面」，Android 用 Chrome 右上角「⋮ → 加到主畫面」或「安裝應用程式」。</p>
    <p class="note" style="margin-top:-4px">重新開始不會刪掉暫存點和存檔格。</p>`;
  $('hpBody').innerHTML = h;
  $('hpBody').querySelectorAll('[data-h]').forEach(b => b.onclick = () => { helpTab = b.dataset.h; openHelp2(); });
  const q = id => $('hpBody').querySelector('#' + id);
  if (q('hpMus')) q('hpMus').onclick = () => { setSound('music'); openHelp2(); };
  if (q('hpPow')) q('hpPow').onclick = () => { setPower(!POWER); openHelp2(); };
  if (q('hpVib')) q('hpVib').onclick = () => { setVib(!VIB); openHelp2(); };
  if (q('hpSfx')) q('hpSfx').onclick = () => { setSound('sfx'); openHelp2(); };
  $('hpBody').querySelectorAll('[data-spo]').forEach(b => b.onclick = () => { S.spOpen = +b.dataset.spo; openHelp2(); });
  $('hpBody').querySelectorAll('[data-spw]').forEach(b => b.onclick = () => { S.spWalk = +b.dataset.spw; openHelp2(); });
  if (q('hpWx')) q('hpWx').onclick = async () => { S.realWx = !S.realWx; saveGame(); openHelp2(); if (S.realWx) await useRealWeather(true); };
  if (q('hpReset')) q('hpReset').onclick = function () { if (this.dataset.c) { closeModals(); startGame(false); } else { this.dataset.c = 1; this.textContent = '再按一次確定'; this.style.background = 'var(--accent)'; this.style.color = '#fff'; } };
}

/* ---------- 天氣 ---------- */
function applyWeatherOverrides() { for (const d in S.wOver || {}) { if (+d <= DAYS) { SEASON.weather[d] = S.wOver[d].w; SEASON.temp[d] = S.wOver[d].t; } } rebuildSeason(); }
async function useRealWeather(manual) {
  if (PHASE() !== 'pre') { if (manual) toast('即時天氣會從明天盤前開始套用'); return; }
  const r = await fetchRealWeather();
  if (!r) { if (manual) toast('抓不到即時天氣（Claude 預覽頁面會擋外部連線），先用模擬天氣'); return; }
  S.wOver[S.day] = r; applyWeatherOverrides(); MK.prices = null; drawBoard(); toast(`台北即時天氣：${WEATHER[r.w].name} ${r.t}°C`); saveGame();
}
async function dayWeather() {
  if (S.realWx) await useRealWeather(false);
  const w = SEASON.weather[Math.min(S.day, DAYS)], tip = { rain: '下雨天證券行人少，成交量會變小', storm: '豪雨特報，市場氣氛偏悲觀', typhoon: '颱風來了，今天會放颱風假休市', sun: '晴天，大家心情不錯', cloud: '陰天' }[w];
  toast(`今天天氣：${WEATHER[w].name} ${SEASON.temp[Math.min(S.day, DAYS)]}°C・${tip}`);
}

  { id: 'rank', text: () => { const nx = RANKS[S.rank + 1]; return nx ? `目標：升級成「${nx.name}」（總資產 ${wan(nx.min)}）` : '你已經是證券大亨了！'; }, done: () => false },
];
let GUIDE = null, goalT = 0;
function goalKey(g) { return g.daily ? `${g.id}@${S.season}-${S.day}` : g.id; }
function updateGoals(dt) {
  goalT -= dt; if (goalT > 0) return; goalT = 0.4; tutTick();
  const list = [];
  for (const g of GOALS) {
    if (g.when && !g.when()) continue;
    const k = goalKey(g);
    if (g.done()) { if (!S.goalSeen[k] && GAME.started) { S.goalSeen[k] = 1; if (g.id !== 'rank') { toast(`完成：${g.text().replace(/（.*?）/g, '')}`); sfx('done'); } } continue; }
    list.push(g); if (list.length >= 3) break;
  }
  if (GUIDE && !list.some(g => g.at === GUIDE)) GUIDE = null;
  const html = goalsHead(list) + (goalsFolded() ? goalsPeek(list) : list.map(g => { const pl = g.at && PLACE_BY[g.at]; const d = pl ? Math.round(angDist(PL.dir, pl.front) * 10) : 0; return `<button data-g="${g.at || ''}"><span class="dot"></span><span>${g.text()}${pl && d > 25 ? `<span class="go">${GUIDE === g.at ? '帶路中' : '帶路'} ${d} 公尺</span>` : ''}</span></button>`; }).join(''));
  const el = $('goals'); if (el._h !== html) { el._h = html; el.innerHTML = html; el.querySelectorAll('[data-gh]').forEach(b => b.onclick = () => { toggleGoals(); el._h = ''; goalT = 0; }); el.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { const a = b.dataset.g; if (!a) return; GUIDE = GUIDE === a ? null : a; if (GUIDE) toast(`已標出目的地：${PLACE_BY[a].name}`); goalT = 0; }); }
}

/* ---------- 紙本股票憑證（彩蛋） ---------- */
const CERTS = [];
function buildCerts() {
  const mat = new THREE.MeshBasicMaterial({ color: 0xfff1c8 }), seal = new THREE.MeshBasicMaterial({ color: 0xd7263d });
  EGG_CERT_POS.forEach((d, i) => {
    const g = new THREE.Group(); const p = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.36, 0.03), mat); g.add(p);
    const sl = new THREE.Mesh(new THREE.CircleGeometry(0.07, 16), seal); sl.position.set(0.14, -0.08, 0.02); g.add(sl);
    const ring = new THREE.Mesh(new THREE.RingGeometry(0.34, 0.4, 24), new THREE.MeshBasicMaterial({ color: 0xffd27a, transparent: true, opacity: 0.7, side: THREE.DoubleSide })); g.add(ring);
    scene.add(g); CERTS.push({ g, d, ring, i });
  });
}
function updateCerts(dt) {
  for (const c of CERTS) {
    const got = S.certs.includes(c.i); c.g.visible = !got && GAME.mode === 'ground' && angDist(PL.dir, c.d) < 30; if (!c.g.visible) continue;
    const up = c.d, f = tangentize(new V3(0, 0, 1).applyAxisAngle(up, GAME.t * 1.5), up); placeOn(c.g, up, f, 0.9 + Math.sin(GAME.t * 2 + c.i) * 0.12);
    c.ring.material.opacity = 0.45 + Math.sin(GAME.t * 4) * 0.3;
    if (!GAME.busy && angDist(PL.dir, c.d) < 1.2) {
      S.certs.push(c.i); sfx('done');
      const n = Object.keys(S.eggs).length + S.certs.length, tot = EGG_LIST.length + EGG_CERT_POS.length;
      if (n >= tot) achieve('eggs'); if (S.certs.length >= EGG_CERT_POS.length) { S.cash += 100000; toast(`集滿 5 張紙本股票憑證！收藏家用 10 萬元收購了（${n}/${tot}）`); }
      else toast(`撿到一張泛黃的紙本股票憑證（${S.certs.length}/${EGG_CERT_POS.length}）・彩蛋 ${n}/${tot}`);
      $('noteBadge').classList.remove('hide');
    }
  }
}

/* ---------- 存檔與讀檔 ---------- */
const SLOT_KEYS = ['stock-tycoon-slot-1', 'stock-tycoon-slot-2', 'stock-tycoon-slot-3'];
let svConfirm = null;
function readSlot(k) { try { const j = JSON.parse(localStorage.getItem(k)); if (!j) return null; return j.s ? j : { s: j, at: null, sum: null }; } catch (e) { return null; } }
function snapshotWrap() {
  S.min = TIME.min; S.pos = PL.dir.toArray();
  return { v: 1, at: Date.now(), sum: { season: S.season, day: S.day, time: fmtTime(), net: Math.round(netWorth()), rank: RANKS[S.rank].name }, s: JSON.parse(JSON.stringify(S)) };
}
function slotText(x) {
  if (!x) return '（空的）';
  const m = x.sum || { season: x.s.season, day: x.s.day, time: '', net: null, rank: RANKS[x.s.rank || 0].name };
  const when = x.at ? new Date(x.at).toLocaleString('zh-TW', { hour12: false, month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
  return `第 ${m.season} 個月・第 ${m.day} 天 ${m.time}・${m.rank}${m.net != null ? `・總資產 ${wan(m.net)}` : ''}${when ? `<br>存於 ${when}` : ''}`;
}
function openSaves() {
  if (GAME.started && GAME.busy && $('saves').classList.contains('hide')) return;
  if (GAME.started) GAME.busy = true;
  $('saves').classList.remove('hide'); renderSaves();
}
function renderSaves(msg) {
  const ing = GAME.started;

  let h = msg ? `<div class="sum">${msg}</div>` : '';
  if (!ok) h += '<div class="sum">這個瀏覽器不允許儲存資料（例如無痕模式）。可以用下方的「存檔碼」自己保存進度。</div>';
  h += `<p class="note" style="margin-top:0">遊戲不會自動存檔。隨時按 <b>Q</b>（或這裡的「暫存目前進度」）留一個暫存點，玩壞了可以回到那一刻；想長久保存就存到存檔格。存檔只在這台裝置的這個瀏覽器裡，換裝置請用下方的存檔碼。${ing ? '' : '目前在標題畫面，只能讀取。'}</p>`;
  const rows = [['quick', '暫存點', QUICK_KEY]].concat(SLOT_KEYS.map((k, i) => [String(i + 1), `存檔 ${i + 1}`, k]));
  for (const [id, name, key] of rows) {

    if (x) acts.push(`<button class="btn pri" data-load="${id}">${id === 'quick' ? '回到暫存點' : '讀取'}</button>`);
    if (x) acts.push(`<button class="btn" data-del="${id}">${id === 'quick' ? '清除' : '刪除'}</button>`);
    h += `<div class="slot"><div><b>${name}</b><small>${slotText(x)}</small></div><div class="acts">${acts.join('')}</div></div>`;
  }
  h += `<h4 style="margin:16px 0 6px">存檔碼（換裝置、備份用）</h4>
    <textarea id="svCode" placeholder="${ing ? '按「產生存檔碼」，或貼上之前複製的存檔碼' : '貼上之前複製的存檔碼'}"></textarea>
    <p style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 0">${ing ? '<button class="btn" id="svExport">產生並複製存檔碼</button>' : ''}<button class="btn pri" id="svImport">讀取存檔碼</button></p>`;
  $('svBody').innerHTML = h;
  const keyOf = id => id === 'quick' ? QUICK_KEY : SLOT_KEYS[+id - 1];
  const nameOf = id => id === 'quick' ? '暫存點' : `存檔 ${id}`;
  $('svBody').querySelectorAll('[data-save]').forEach(b => b.onclick = () => {
    const id = b.dataset.save, k = keyOf(id);

  });
  $('svBody').querySelectorAll('[data-load]').forEach(b => b.onclick = () => { const x = readSlot(keyOf(b.dataset.load)); if (x) { $('saves').classList.add('hide'); startGame(true, x.s); } });
  $('svBody').querySelectorAll('[data-del]').forEach(b => b.onclick = () => { const id = b.dataset.del; if (svConfirm !== 'del' + id) { svConfirm = 'del' + id; b.textContent = '再按一次刪除'; return; } svConfirm = null; try { localStorage.removeItem(keyOf(id)); } catch (e) { } renderSaves(`已刪除「${nameOf(id)}」`); });
  const ex = $('svBody').querySelector('#svExport');

    catch (e) { renderSaves('存檔碼看起來不完整，請確認整段都有貼上（開頭是 ZQDH1:）'); }
  };
}

function marketPulse() {

  const p = prices(), pc = prevClose();

    if (!listedNow(i)) return;
    const [up, dn] = limits(pc[i]), long = ((S.hold[s.id] || {}).q || 0) + ((S.mar[s.id] || {}).q || 0), short = (S.sht[s.id] || {}).q || 0;

  });
}

}

}

      const key = S.season * 100 + S.day; if (S.stepsDay >= 10000 && S.stepGoal !== key) { S.stepGoal = key; toast('今天走了一萬步！日行萬步，身體健康'); sfx('done'); achieve('walker'); }
    }

  stepLast = PL.dir.clone();
  stepT -= dt; if (stepT < 0) { stepT = 0.3; const el = $('chStep').lastElementChild, t = Math.floor(S.stepsDay || 0).toLocaleString('zh-TW'); if (el.textContent !== t) el.textContent = t; }
}

/* ---------- 進出 ---------- */
function roomDoorDir(id) { const p = PLACE_BY[ROOMS[id].place]; return p && slot(p.road, p.s, p.side, 3.9).dir; }
function doorNear(best) {
  if (GAME.mode !== 'ground') return best;
  const bd = best ? angDist(PL.dir, best.dir) : 99;
  for (const id in ROOMS) { const d = roomDoorDir(id); if (!d) continue; const dd = angDist(PL.dir, d); if (dd < 1.25 && dd < bd) return { door: id, verb: `進入${ROOMS[id].place === 'home' ? HOUSES[houseTier()].place : ROOMS[id].name}`, act: () => enterInterior(id) }; }
  return best;
}
function buildRoom(id) {
  const R0 = ROOMS[id], key = R0.key ? R0.key() : 0, old = IN.groups[id];
  if (old && old.userData.key === key) return old;
  if (old) { scene.remove(old); old.userData.people.forEach(p => p.ch && scene.remove(p.ch.root)); }
  const g = new THREE.Group(); g.position.copy(IN_O); g.userData.key = key;
  const room = { w: R0.w, d: R0.d, people: [], spots: [], obs: [] }; R0.build(g, room);
  for (const p of room.people) {
    const L = Object.assign({}, p.npc ? LOOKS[NPC_BY[p.npc].look] : LOOKS[p.look]); delete L.hold;
    p.ch = new Character(L); if (p.sit) p.ch.mode = 'sit'; g.add(p.ch.root); p.ch.root.position.set(p.x, 0, p.z); p.ch.root.rotation.y = p.face;
  }
  g.userData.room = room; g.userData.people = room.people; scene.add(g); IN.groups[id] = g; return g;
}
async function enterInterior(id) {
  const R0 = ROOMS[id]; if (!R0 || GAME.busy) return; const why = R0.closed && R0.closed(); if (why) { toast(why); return; }
  GAME.busy = true; $('fade').style.opacity = 1; await wait(320);
  const g = buildRoom(id); for (const k in IN.groups) IN.groups[k].visible = k === id;
  const room = g.userData.room; Object.assign(IN, { id, room, people: room.people, spots: room.spots, obs: room.obs, x: 0, z: room.d / 2 - 0.9, fx: 0, fz: -1, speed: 0, goal: null });

  $('fade').style.opacity = 0; GAME.busy = false; sfx('blip'); if (R0.onEnter) R0.onEnter();
}
function exitInterior(quick) {
  if (GAME.mode !== 'interior') return; const id = IN.id, d = roomDoorDir(id), p = PLACE_BY[ROOMS[id].place];
  if (IN.groups[id]) IN.groups[id].visible = false; IN.id = null; GAME.mode = 'ground';

}
const refreshNear = () => { NEAR = interiorNear(); };

/* ---------- 室內每一幀 ---------- */
function interiorNear() {
  if (GAME.mode !== 'interior' || GAME.busy) return null; let best = null, bd = 9;
  for (const s of IN.spots) { const d = Math.hypot(IN.x - s.x, IN.z - s.z); if (d < s.r && d < bd) { bd = d; best = s; } }
  for (const p of IN.people) { if (!p.npc || !p.ch.root.visible) continue; const d = Math.hypot(IN.x - p.x, IN.z - p.z); if (d < 1.5 && d < bd) { const n = NPC_BY[p.npc]; bd = d; best = { verb: `和${n.name}說話`, act: () => talkTo(n) }; } }
  if (Math.abs(IN.x) < 0.9 && IN.z > IN.room.d / 2 - 1.1 && !best) best = { verb: '離開', act: () => exitInterior() };
  return best;
}
function interiorUpdate(dt) {
  let inp = GAME.busy ? { x: 0, y: 0, run: false } : moveInput();
  if (IN.goal && !GAME.busy) { if (Math.hypot(inp.x, inp.y) > 0.05) IN.goal = null; else { const dx = IN.goal.x - IN.x, dz = IN.goal.z - IN.z, d = Math.hypot(dx, dz); if (d < 1.0) { const g = IN.goal; IN.goal = null; setTimeout(g.done, 0); } else inp = { x: dx / d, y: -dz / d, run: false }; } }
  const mag = Math.min(1, Math.hypot(inp.x, inp.y)), tgt = mag > 0.05 ? (inp.run ? 5 : 3.2) * mag : 0;
  IN.speed = lerp(IN.speed, tgt, 1 - Math.exp(-dt * 10));
  if (mag > 0.05) { const fx = inp.x / Math.max(mag, 1e-6), fz = -inp.y / Math.max(mag, 1e-6), k = 1 - Math.exp(-dt * 12); IN.fx += (fx - IN.fx) * k; IN.fz += (fz - IN.fz) * k; const l = Math.hypot(IN.fx, IN.fz) || 1; IN.fx /= l; IN.fz /= l; }
  if (IN.speed > 0.05) {
    const r = IN.room; let nx = IN.x + IN.fx * IN.speed * dt, nz = IN.z + IN.fz * IN.speed * dt;
    if (nz > r.d / 2 - 0.15 && Math.abs(nx) < 0.9) { exitInterior(); return; }
    nx = clamp(nx, -r.w / 2 + 0.35, r.w / 2 - 0.35); nz = clamp(nz, -r.d / 2 + 0.35, r.d / 2 - 0.3);
    for (const o of IN.obs) { const hx = o.w / 2 + 0.3, hz = o.d / 2 + 0.3, ox = nx - o.x, oz = nz - o.z; if (Math.abs(ox) < hx && Math.abs(oz) < hz) { if (hx - Math.abs(ox) < hz - Math.abs(oz)) nx = o.x + Math.sign(ox || 1) * hx; else nz = o.z + Math.sign(oz || 1) * hz; } }
    IN.x = nx; IN.z = nz;
  }
  PL.ch.root.position.set(IN_O.x + IN.x, IN_O.y, IN_O.z + IN.z); PL.ch.root.rotation.set(0, Math.atan2(IN.fx, IN.fz), 0); PL.ch.root.scale.setScalar(1);
  PL.ch.speed = IN.speed / 5; PL.ch.update(dt, GAME.t);
  // 盯盤的人跟著行情反應
  IN.cheerT -= dt; const mood = marketMood();
  for (const p of IN.people) {
    if (p.npc) { const n = NPC_BY[p.npc]; p.ch.root.visible = !(n.night && PHASE() !== 'night'); p.ch.say(DLG.active && DLG.who === n); }
    if (p.crowd && IN.cheerT < 0 && PHASE() === 'open' && Math.random() < 0.3) { if (mood > 0.015) p.ch.wave = 1.8; }
    p.ch.update(dt, GAME.t);
  }
  if (IN.cheerT < 0) { IN.cheerT = 4; if (IN.id === 'broker' && PHASE() === 'open') { const c = IN.people.filter(p => p.crowd); const p = c[Math.random() * c.length | 0]; if (p) IN.bubble = { p, t: 3, txt: mood > 0.02 ? '漲停啦！發了發了！' : mood > 0.004 ? '紅通通，好看！' : mood < -0.02 ? '跌停了……我的買菜錢！' : mood < -0.004 ? '唉，又綠了。' : '今天怎麼這麼悶？' }; } }
  if (IN.bubble) IN.bubble.t -= dt;
}
